[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ptp-vast-mcp"
version = "0.1.1"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "fastmcp==3.4.11",
    "mcp==1.30.0",
    "httpx==0.28.1",
    "filelock>=3.20,<4",
    "tomlkit>=0.14,<1",
]
description = "Local Vast.ai discovery MCP and human-approved GPU lifecycle for Patent-to-Pilot"

[project.scripts]
ptp-vast = "ptp_vast_mcp.cli:main"
ptp-vast-mcp = "ptp_vast_mcp.mcp_server:main"
vast-mcp = "vast_mcp.cli:main"

[tool.setuptools]
packages = ["ptp_vast_mcp", "vast_mcp"]

[tool.setuptools.package-dir]
vast_mcp = "src/vast_mcp"

[dependency-groups]
dev = ["pytest>=9,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
